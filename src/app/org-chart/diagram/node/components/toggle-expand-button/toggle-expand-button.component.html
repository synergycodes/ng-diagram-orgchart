@if (hasChildren()) {
  <button
    class="toggle-btn p11"
    type="button"
    tabindex="-1"
    data-node-action="toggleExpand"
    [attr.aria-label]="ariaLabel()"
    (pointerdown)="$event.stopPropagation()"
    (click)="onToggle($event)"
  >
    @if (isCollapsed()) {
      <span aria-hidden="true">{{ collapsedChildrenCount() }}</span>
    } @else {
      <img src="assets/minus.svg" alt="" width="13" height="13" />
    }
  </button>
}
