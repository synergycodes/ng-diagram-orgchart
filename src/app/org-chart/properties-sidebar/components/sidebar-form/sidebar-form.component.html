<div class="form-section">
  <h3 class="h10 section-title">General Information</h3>

  <div class="section-content">
    <app-form-field label="Full Name" fieldId="fullName">
      <input
        id="fullName"
        type="text"
        class="form-input p10"
        [formField]="fieldTree.fullName"
        [appAutofocus]="firstFieldFocusRequest()"
      />
    </app-form-field>

    <app-form-field label="Role" fieldId="role">
      <app-combobox triggerId="role" [formField]="fieldTree.role" [options]="roleOptions()" />
    </app-form-field>

    <app-form-field label="Description" fieldId="description">
      <textarea
        id="description"
        class="form-input form-textarea p10"
        [formField]="fieldTree.description"
        rows="3"
      ></textarea>
    </app-form-field>
  </div>
</div>

<div class="form-separator"></div>

<div class="form-section">
  <h3 class="h10 section-title">Organization Structure</h3>

  <div class="section-content">
    <app-form-field label="Reports to" fieldId="reportsTo">
      <app-reports-to-field
        triggerId="reportsTo"
        [candidateNodes]="reportsToCandidateNodes()"
        [formField]="fieldTree.reportsTo"
      />
    </app-form-field>
  </div>
</div>
